services:
  - type: web
    name: ai-growth-and-commerce-agent
    env: python
    rootDir: .
    buildCommand: cd backend && find . -name __pycache__ -exec rm -rf {} + 2>/dev/null; pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-commerce-db
          property: connectionString
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        value: ""
      - key: ALLOWED_ORIGINS
        value: ""

databases:
  - name: ai-commerce-db
    plan: free
    databaseName: aicommerce
    user: aicommerce_user
